<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#050510;color:white;min-height:100vh;overflow-x:hidden;position:relative}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle 2s infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.shooting{position:fixed;width:120px;height:3px;background:linear-gradient(90deg,white,transparent);border-radius:10px;transform:rotate(-30deg);animation:shoot 4s infinite;z-index:0;pointer-events:none;opacity:0}
@keyframes shoot{0%{top:10%;left:90%;opacity:0}5%{opacity:1}15%{top:35%;left:55%;opacity:0}100%{opacity:0}}
header{text-align:center;padding:30px 15px;position:relative;z-index:1}
h1{font-size:42px;color:#FFD700;text-shadow:0 0 20px #FFD700,0 0 40px orange;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
p.sub{color:#ccc;margin-top:8px}
.filter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px}
